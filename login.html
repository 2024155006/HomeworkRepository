<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 영화 정보 사이트</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="container">
        
        <nav class="navbar">
            <a href="index.html" class="nav-item">메인페이지</a>
            <a href="login.html" class="nav-item">로그인</a>
            <a href="signup.html" class="nav-item">회원가입</a>
        </nav>

        <header class="header-animation">
            <h1 class="sliding-text">로그인 페이지입니다.</h1>
        </header>

        <main class="main-content">
            <section class="auth-container">
                <h2>로그인</h2>
                <form action="#" method="post" class="auth-form">
                    <div class="form-group">
                        <label for="user-id">아이디</label>
                        <input type="text" id="user-id" name="user-id" required>
                    </div>
                    <div class="form-group">
                        <label for="password">비밀번호</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <button type="submit" class="submit-btn">로그인</button>
                </form>
                <div class="auth-links">
                    <p>계정이 없으신가요? <a href="signup.html">회원가입 하러가기</a></p>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
