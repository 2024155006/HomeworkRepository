<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인프밍 영화 정보 사이트 - 로그인</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>

    <div id="wrapper">
        
        <header>
            <h1>인프밍 영화 정보 사이트입니다.</h1>
            <nav>
                <a href="index.html">메인페이지</a>
                <a href="login.html" class="active">로그인</a>
                <a href="signup.html">회원가입</a>
            </nav>
        </header>

        <hr>

        <main class="auth-container">
            <h2>Login</h2>
            <form id="login-form" onsubmit="event.preventDefault(); alert('로그인 기능은 다음 과제에서 구현될 예정입니다!');">
                <div class="form-group">
                    <label for="login-id">사용자 이름 (ID)</label>
                    <input type="text" id="login-id" placeholder="아이디를 입력하세요." required>
                </div>
                <div class="form-group">
                    <label for="login-pw">비밀번호</label>
                    <input type="password" id="login-pw" placeholder="비밀번호를 입력하세요." required>
                </div>
                <button type="submit" class="auth-btn">로그인</button>
            </form>
            <div class="auth-footer">
                <p>아직 회원이 아니신가요? <a href="signup.html">회원가입하기</a></p>
            </div>
        </main>

    </div>

</body>
</html>
