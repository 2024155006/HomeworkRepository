<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>LAB2 - signup.html</title>
    <link rel="stylesheet" type="text/css" href="main.css">
</head>
<body>

    <h1>Welcome to INTERNET-PROGRAMMING MOVIE SITE</h1>

    <div class="nav-links">
        <a href="login.html">로그인</a> | <a href="signup.html">회원가입</a>
    </div>

    <div class="form-border">
        <form action="login.html">
            <table>
                <tr>
                    <td>이름 :</td>
                    <td><input type="text" name="name" autofocus></td>
                </tr>
                <tr>
                    <td>생일 :</td>
                    <td><input type="date" name="birthday"></td>
                </tr>
                <tr>
                    <td>성별 :</td>
                    <td>
                        <input type="radio" name="gender" value="male"> 남성
                        <input type="radio" name="gender" value="female"> 여성
                    </td>
                </tr>
                <tr>
                    <td>학년 :</td>
                    <td><input type="number" name="grade" min="1" max="4" step="1"></td>
                </tr>
                <tr>
                    <td>아이디 :</td>
                    <td><input type="text" name="userid" autocomplete="username"></td>
                </tr>
                <tr>
                    <td>비밀번호 :</td>
                    <td><input type="password" name="password" required></td>
                </tr>
                <tr>
                    <td>이메일 :</td>
                    <td><input type="email" name="email" placeholder="아이디@yonsei.ac.kr"></td>
                </tr>
                <tr>
                    <td>보안 질문 :</td>
                    <td>
                        <select name="security_question">
                            <option value="">질문을 선택하세요</option>
                            <option value="1">가장 좋아하는 운동선수 이름은?</option>
                            <option value="2">가장 좋아하는 영화 제목은?</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>답변 :</td>
                    <td><input type="text" name="answer"></td>
                </tr>
            </table>

            <div class="button-area">
                <button type="submit" class="signup-btn">Signup</button>
                <button type="reset" class="cancel-btn">Cancel</button>
            </div>
        </form>
    </div>

</body>
</html>
