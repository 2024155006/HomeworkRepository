<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="container">
        
        <nav class="navbar">
            <a href="index.html" class="nav-item">메인페이지</a>
            <a href="login.html" class="nav-item">로그인</a>
            <a href="signup.html" class="nav-item">회원가입</a>
        </nav>

        <header class="header-animation">
            <h1 class="sliding-text">영화 정보 사이트</h1>
        </header>

        <main class="main-content">
            
            <section class="movies-container">
                <h2>Movies</h2>
                
                <div class="movie-list">
                    
                    <article class="movie-item">
                        <div class="image-wrapper">
                            <img src="images/toy_story.jpg" alt="Toy Story">
                            <div class="movie-name-overlay">Toy Story</div>
                        </div>
                    </article>

                    <article class="movie-item">
                        <div class="image-wrapper">
                            <img src="images/pianist.jpg" alt="The Pianist">
                            <div class="movie-name-overlay">The Pianist</div>
                        </div>
                    </article>

                    <article class="movie-item">
                        <div class="image-wrapper">
                            <img src="images/deadpool.jpg" alt="Deadpool">
                            <div class="movie-name-overlay">Deadpool</div>
                        </div>
                    </article>

                    <article class="movie-item">
                        <div class="image-wrapper">
                            <img src="images/memento.jpg" alt="Memento">
                            <div class="movie-name-overlay">Memento</div>
                        </div>
                    </article>

                </div>
            </section>

            <section class="about-container">
                <h2>About</h2>
                <div class="about-content">
                    <p>영화 정보 사이트입니다. 좋아하는 영화를 검색할 수 있습니다.</p>
                    <p>왼쪽부터 Toy Story, The Pianist, Deadpool, Memento입니다.</p>
                </div>
            </section>

        </main>
    </div>
</body>
</html>
